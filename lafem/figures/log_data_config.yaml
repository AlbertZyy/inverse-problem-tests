
plot:
  lafem/logs_data/unet100_nn_nograd.csv:
    xkey: 'Step'
    ykey: 'loss(validate)'
    args:
      label: '$\gamma = 0$'
      color: 'black'
      linestyle: '-'
      linewidth: 1
      marker: ''
      markersize: 1
      alpha: 0.8

  lafem/logs_data/unet100_nn_single.csv:
    xkey: 'Step'
    ykey: 'loss(validate)'
    args:
      label: 'single'
      color: 'red'
      linestyle: '-'
      linewidth: 1
      marker: ''
      markersize: 1
      alpha: 0.8

  lafem/logs_data/unet100_nn_multi.csv:
    xkey: 'Step'
    ykey: 'loss(validate)'
    args:
      label: 'multi'
      color: 'green'
      linestyle: '-'
      linewidth: 1
      marker: ''
      markersize: 1
      alpha: 0.8

figsize: [8, 6]
title: 'Validation Loss (without noise)'

xlog: False
ylog: True

xlim: [20000, 30000]

ylim: [0.03, 0.06]
yticks: [0.03, 0.035, 0.04, 0.045, 0.05, 0.055]

xlabel: 'Iteration'
ylabel: 'Loss'

