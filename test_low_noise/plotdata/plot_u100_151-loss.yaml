
# 'line' or 'scatter'
plot_type: 'line'

csv_files:
  - './test_low_noise/plotdata/run-u100_n151-tag-loss_train_.csv'
  - './test_low_noise/plotdata/run-u100_n151-tag-loss_validate_.csv'
  - './test_low_noise/plotdata/run-u100_n151_sng-tag-loss_train_.csv'
  - './test_low_noise/plotdata/run-u100_n151_sng-tag-loss_validate_.csv'

log: False
smooth: 0.8

legends:
  - training
  - validation
  - training (sng)
  - validation (sng)

fig_name: 'loss'
title: 'Loss (noise 1.51, smooth 0.8)'

xlabel: 'iteration'
ylabel: 'loss'

xlim: 'auto'
ylim: [0.0, 0.12]

show: True
save: './test_low_noise/plotdata/loss_u100_n151.png'
