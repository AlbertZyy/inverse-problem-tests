
# 'line' or 'scatter'
plot_type: 'line'

csv_files:
  - './test_model_size/plot_data/run-unet_600_s0-tag-s.csv'
  - './test_model_size/plot_data/run-unet_600_s50-tag-s.csv'

log: False

legends:
  - unet 600, s 0.0
  - unet 600, s 0.5

fig_name: 'value of s'
title: 'Value of s'

xlabel: 'iteration'
ylabel: 's'

xlim: 'auto'
ylim: [0.0, 0.5]

show: True
save: './test_model_size/plot_data/s_600.png'
