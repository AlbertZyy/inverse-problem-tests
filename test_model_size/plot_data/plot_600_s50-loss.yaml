
# 'line' or 'scatter'
plot_type: 'line'

csv_files:
  - './test_model_size/plot_data/run-unet_600_s50-tag-loss_train_.csv'
  - './test_model_size/plot_data/run-unet_600_s50-tag-loss_validate_.csv'

log: False
smooth: 0.8

legends:
  - training
  - validation

fig_name: 'loss'
title: 'Loss (s_0 = 0.5, smoothing 0.8)'

xlabel: 'iteration'
ylabel: 'loss'

xlim: 'auto'
ylim: [0.0, 0.11]

show: True
save: './test_model_size/plot_data/loss_600_s50.png'
