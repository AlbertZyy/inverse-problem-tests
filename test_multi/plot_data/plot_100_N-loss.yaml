
# 'line' or 'scatter'
plot_type: 'line'

csv_files:
  - './test_multi/plot_data/run-u100_N-tag-loss_train_.csv'
  - './test_multi/plot_data/run-u100_N-tag-loss_validate_.csv'

log: False
smooth: 0.8

legends:
  - training
  - validation

fig_name: 'loss'
title: 'Loss (s trainable, noise 5%, smoothing 0.8)'

xlabel: 'iteration'
ylabel: 'loss'

xlim: 'auto'
ylim: [0.04, 0.10]

show: True
save: './test_multi/plot_data/loss_u100_N.png'
