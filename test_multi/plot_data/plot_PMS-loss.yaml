
# 'line' or 'scatter'
plot_type: 'line'

csv_files:
  - './test_multi/plot_data/run-u100_P-tag-loss_validate_.csv'
  - './test_multi/plot_data/run-u100M_P-tag-loss_validate_.csv'
  - './test_multi/plot_data/run-u100_PN-tag-loss_validate_.csv'
  - './test_multi/plot_data/run-u100M_PN-tag-loss_validate_.csv'

log: False
smooth: 0.8

legends:
  - single s, noise0%
  - multiple s, noise 0%
  - single s, noise 5%
  - multiple s, noise 5%


fig_name: 'loss'
title: 'Validation Loss (single vs. multiple, 4x2, smooth 0.8)'

xlabel: 'iteration'
ylabel: 'loss'

xlim: 'auto'
ylim: [0.04, 0.14]

show: True
save: './test_multi/plot_data/loss_PMS.png'
