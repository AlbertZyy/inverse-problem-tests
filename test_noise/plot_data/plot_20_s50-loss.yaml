
# 'line' or 'scatter'
plot_type: 'line'

csv_files:
  - './test_noise/plot_data/run-noise_20_s50-tag-loss_train_.csv'
  - './test_noise/plot_data/run-noise_20_s50-tag-loss_validate_.csv'

log: False
smooth: 0.8

legends:
  - training
  - validation

fig_name: 'loss'
title: 'Loss (s fixed to 0, smoothing 0.8)'

xlabel: 'iteration'
ylabel: 'loss'

xlim: 'auto'
ylim: [0.0, 0.18]

show: True
save: './test_noise/plot_data/loss_20_s50.png'
